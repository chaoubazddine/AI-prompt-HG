      <header>
        <h1>منصة الاجتماعيات الذكية (Jadha AI) - جذاذات وفروض وملخصات مادة الاجتماعيات بالمغرب</h1>
        <p>المنصة التربوية الأولى لأساتذة مادة الاجتماعيات بالسلكين الإعدادي والتأهيلي وإعداديات الريادة بالمملكة المغربية.</p>
      </header>
      <main>
        <section>
          <h2>جذاذات مادة الاجتماعيات</h2>
          <p>توليد جذاذات بيداغوجية لمكون التاريخ، مكون الجغرافيا، ومكون التربية على المواطنة لجميع المستويات: الأولى إعدادي، الثانية إعدادي، الثالثة إعدادي، الجذع المشترك، الأولى باكالوريا، والثانية باكالوريا بصيغة Word DOCX و PDF.</p>
        </section>
        <section>
          <h2>الفروض والامتحانات المحروسة</h2>
          <p>إنشاء فروض محروسة وامتحانات موحدة مع عناصر الإجابة المفصلة وسلالم التنقيط وفق الأطر المرجعية الرسمية.</p>
        </section>
        <section>
          <h2>حقيبة التقويم التشخيصي والدعم البيداغوجي</h2>
          <p>روائز التقويم التشخيصي، شبكات تفريغ النتائج، التقارير التركيبية، خطط الدعم والمعالجة، وجذاذات الدعم الصفي الموجه.</p>
        </section>
        <section>
          <h2>فضاء إعداديات الريادة (Collèges Pionniers)</h2>
          <p>جذاذات التدريس الصريح، فروض التقويم المستمر لمؤسسات الريادة، وروائز تموضع TaRL في مادة الاجتماعيات.</p>
        </section>
