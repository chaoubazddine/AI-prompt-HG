      <header>
        <h1>منصة الاجتماعيات الذكية (HG-PROF.MA) - جذاذات، فروض، ملخصات، وعروض PowerPoint لمادة الاجتماعيات بالمغرب</h1>
        <p>المنصة البيداغوجية المغربية الشاملة لأساتذة مادة التاريخ والجغرافيا والتربية على المواطنة بالسلكين الإعدادي والتأهيلي ومؤسسات الريادة.</p>
      </header>
      <main>
        <article>
          <h2>1. جذاذات مادة الاجتماعيات بصيغة Word DOCX و PDF</h2>
          <p>توليد جذاذات ديداكتيكية رقمية محينة لجميع دروس المنهاج المغربي:</p>
          <ul>
            <li><strong>جذاذات الأولى إعدادي:</strong> كتاب في رحاب الاجتماعيات، كتاب فضاء الاجتماعيات.</li>
            <li><strong>جذاذات الثانية إعدادي:</strong> كتاب منار الاجتماعيات، كتاب النجاح في الاجتماعيات.</li>
            <li><strong>جذاذات الثالثة إعدادي:</strong> كتاب منار الاجتماعيات، كتاب الجديد في الاجتماعيات، كتاب تجديد النشاط العلمي والاجتماعيات.</li>
            <li><strong>جذاذات الجذع المشترك:</strong> الجذع المشترك آداب وعلوم إنسانية، الجذع المشترك العلمي والتكنولوجي.</li>
            <li><strong>جذاذات الأولى باكالوريا:</strong> شعبة الآداب والعلوم الإنسانية، شعبة العلوم التجريبية والرياضية والاقتصادية (الامتحان الجهوي الموحد).</li>
            <li><strong>جذاذات الثانية باكالوريا:</strong> شعبة الآداب والعلوم الإنسانية، مسلك العلوم الإنسانية.</li>
          </ul>
        </article>
        <article>
          <h2>2. فروض وامتحانات محروسة مع عناصر الإجابة وسلم التنقيط</h2>
          <p>نماذج الفروض المحروسة للدورة الأولى والدورة الثانية، مع وضعيات اختبارية ثلاثية (الاشتغال على وثائق في التاريخ أو الجغرافيا، المفاهيم والأسئلة الموضوعية، والموضوع المقالي الإنشائي وفق الأطر المرجعية الوزارية).</p>
        </article>
        <article>
          <h2>3. عروض تقديمية PowerPoint تفاعلية بصيغة PPTX</h2>
          <p>عروض بيداغوجية احترافية مدعومة بالخرائط والرسوم البيانية والخطاطات وصور عالية الدقة قابلة للتعديل والتقديم في قاعات التدريس والألواح التفاعلية.</p>
        </article>
        <article>
          <h2>4. فضاء إعداديات الريادة (Collèges Pionniers) والتدريس الصريح</h2>
          <p>حقيبة ديداكتيكية متخصصة لمؤسسات الريادة تشمل جذاذات التدريس الصريح (النمذجة، الممارسة الموجهة، الممارسة المستقلة)، روائز تموضع TaRL، وشبكات التقويم والتحقق من الفهم.</p>
        </article>
        <article>
          <h2>5. حقيبة التقويم التشخيصي والدعم البيداغوجي</h2>
          <p>روائز التقويم التشخيصي لبداية الموسم الدراسي، شبكات تفريغ النقط، استيراد نقط منظومة مسار Excel، والتقرير التركيبي وخطة المعالجة والدعم المندمج.</p>
        </article>
      </main>
